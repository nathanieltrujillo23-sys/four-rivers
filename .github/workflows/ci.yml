# Runs on every push to main and on every pull request.
# Vercel builds a preview site for each pull request on its own (Git integration), so the "preview
# deployments" piece lives there; these jobs make sure the change is safe before it goes out.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    env:
      # The app needs these to build; the tests use the in-memory demo account, so any values work.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: node scripts/build-schema.mjs --check
      - name: Database permission tests (in-process Postgres)
        run: npm run test:db
      - run: npm run build

  e2e:
    name: Browser tests (and accessibility scan)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  database:
    name: Database permission tests
    runs-on: ubuntu-latest
    # The same tests also run in the "checks" job on an in-process Postgres. This job is the reference run on
    # the real Supabase stack; it stays advisory until it has been green once.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,realtime,storage-api,postgres-meta
      - run: supabase test db
